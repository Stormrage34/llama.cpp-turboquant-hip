name: Release

on:
  workflow_dispatch: # allows manual triggering
    inputs:
      create_release:
        description: 'Create new release'
        required: true
        type: boolean
      version:
        description: 'Stable version tag (e.g. v0.5.0). Appends "-stable". Overrides auto-generated tag.'
        required: false
        type: string
  push:
    branches:
      - main
    paths: [
      '.github/workflows/release.yml',
      '**/CMakeLists.txt',
      '**/.cmake',
      '**/*.h',
      '**/*.hpp',
      '**/*.c',
      '**/*.cpp',
      '**/*.cu',
      '**/*.cuh',
      '**/*.swift',
      '**/*.m',
      '**/*.metal',
      '**/*.comp',
      '**/*.glsl'
    ]
  schedule:
    # Nightly stable build
    - cron: '0 6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  CMAKE_ARGS: "-DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DGGML_RPC=ON"
  # Set via workflow_dispatch for stable releases; empty for auto-generated tags
  STABLE_VERSION: ${{ github.event.inputs.version || '' }}

jobs:
  ubuntu-22-hip-turboquant:
    runs-on: ubuntu-22.04
    container: rocm/dev-ubuntu-22.04:7.2.1
    # HIP BUILD IS NON-BLOCKING: release proceeds even if ROCm build fails
    # (GitHub Release will just have an empty tarball or skip artifact upload)
    continue-on-error: true

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Dependencies
        id: depends
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake rocblas-dev hipblas-dev libssl-dev rocwmma-dev

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: ubuntu-22-hip-turboquant
          evict-old-files: 1d

      - name: Build with RPATH isolation and RDNA2 optimizations
        id: cmake_build
        run: |
          cmake -B build -S . \
            -DCMAKE_HIP_COMPILER="$(hipconfig -l)/clang" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,--disable-new-dtags" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--disable-new-dtags" \
            -DGGML_HIP_ROCWMMA_FATTN=ON \
            -DGPU_TARGETS="gfx1030" \
            -DGGML_HIP=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_RDNA2_BFE_DISPATCHER=ON \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j $(nproc)

      - name: Verify RPATH
        run: |
          echo "=== Checking RPATH contains \$ORIGIN ==="
          RPATH=$(readelf -d build/bin/llama-cli 2>/dev/null | grep -E 'RPATH|RUNPATH' || echo "")
          if echo "$RPATH" | grep -q 'ORIGIN'; then
            echo "✓ RPATH contains \$ORIGIN"
          else
            echo "✗ RPATH missing \$ORIGIN"
            echo "Full RPATH: $RPATH"
            exit 1
          fi
          echo "$RPATH"
          echo ""
          echo "=== Shared library dependencies ==="
          ldd build/bin/llama-cli 2>&1 | head -20

      - name: List built artifacts
        run: |
          echo "=== Built binaries and libraries ==="
          ls -lh build/bin/
          echo ""
          echo "=== Shared libraries ==="
          ls -lh build/bin/libggml-hip*.so* 2>/dev/null || echo "(no libggml-hip .so files found)"

      - name: Verify binaries exist
        run: |
          # BINARY VERIFICATION: Ensures all required executables were built
          # Prevents shipping incomplete releases (e.g., if build stopped early)
          for bin in llama-server llama-cli llama-bench; do
            [ -x "build/bin/$bin" ] || { echo "$bin missing"; exit 1; }
          done

      - name: Determine tag name
        id: tag
        uses: ./.github/actions/get-tag-name
        with:
          stable_version: ${{ env.STABLE_VERSION }}

      - name: Pack artifacts
        id: pack_artifacts
        run: |
          cp LICENSE ./build/bin/
          # Include all binaries AND shared libraries
          tar -czvf llama-${{ steps.tag.outputs.name }}-bin-ubuntu-hip-turboquant-x64.tar.gz \
            --transform "s,./,llama-${{ steps.tag.outputs.name }}/," \
            -C ./build/bin .

      - name: Verify packed artifacts
        run: |
          echo "=== Release tarball contents ==="
          tar -tzf llama-${{ steps.tag.outputs.name }}-bin-ubuntu-hip-turboquant-x64.tar.gz
          echo ""
          echo "=== Checking for required binaries ==="
          for bin in llama-server llama-cli llama-bench; do
            if tar -tzf llama-${{ steps.tag.outputs.name }}-bin-ubuntu-hip-turboquant-x64.tar.gz | grep -q "$bin"; then
              echo "✓ $bin found in tarball"
            else
              echo "✗ $bin MISSING from tarball"
            fi
          done
          echo ""
          echo "=== Checking for shared libraries ==="
          if tar -tzf llama-${{ steps.tag.outputs.name }}-bin-ubuntu-hip-turboquant-x64.tar.gz | grep -q "libggml-hip"; then
            echo "✓ libggml-hip*.so found in tarball"
          else
            echo "⚠ libggml-hip*.so not found (may be statically linked)"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: llama-${{ steps.tag.outputs.name }}-bin-ubuntu-hip-turboquant-x64.tar.gz
          name: llama-bin-ubuntu-hip-turboquant-x64.tar.gz

  release:
    # HIP BUILD NON-BLOCKING LOGIC:
    # - HIP job has continue-on-error: true (line 198)
    # - This job proceeds even if HIP build failed (result == 'failure')
    # - CPU + Vulkan artifacts ship independently
    # - HIP tarball simply omitted from release if build failed
    if: >
      always() && (
        ( github.event_name == 'push' && github.ref == 'refs/heads/main' ) ||
        github.event.inputs.create_release == 'true' ||
        github.event.inputs.version != '' ||
        github.event_name == 'schedule'
      ) &&
      (needs.ubuntu-22-hip-turboquant.result == 'success' || 
       needs.ubuntu-22-hip-turboquant.result == 'skipped' ||
       needs.ubuntu-22-hip-turboquant.result == 'failure')

    # Fine-grant permission
    # https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
        contents: write # for creating release

    runs-on: ubuntu-22.04

    needs:
      - ubuntu-22-hip-turboquant

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine tag name
        id: tag
        uses: ./.github/actions/get-tag-name
        with:
          stable_version: ${{ env.STABLE_VERSION }}

      - name: Download artifacts
        id: download-artifact
        continue-on-error: true  # HIP artifacts may be absent if HIP build failed
        uses: actions/download-artifact@v7
        with:
          path: ./artifact
          merge-multiple: true

      - name: Move artifacts
        id: move_artifacts
        run: |
          mkdir -p release
          # CRITICAL: shopt -s nullglob prevents "literal *.tar.gz" error when artifact dir is empty
          # (HIP build is the only build — if it fails on continue-on-error: true, no artifacts exist)
          shopt -s nullglob
          for f in artifact/*.tar.gz; do
            [ -f "$f" ] && mv -v "$f" release/
          done

      - name: List release artifacts
        run: |
          echo "=== Release artifacts ==="
          ls -lh release/

      - name: Generate release body
        id: generate_body
        env:
          TAG_NAME: ${{ steps.tag.outputs.name }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Determine release title from event context
          if [ "${EVENT_NAME}" = "schedule" ]; then
            TITLE="Nightly stable build (${TAG_NAME})"
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            TITLE="Manual release ${TAG_NAME}"
          elif [ -n "${COMMIT_MSG}" ]; then
            TITLE="${COMMIT_MSG}"
          else
            TITLE="Release ${TAG_NAME}"
          fi

          {
            echo "<details open>"
            echo ""
            echo "${TITLE}"
            echo ""
            echo "</details>"
            echo ""
          echo "**Linux (AMD RDNA2 — RX 6800 XT / gfx1030):**"
          echo "- [Ubuntu x64 (HIP TurboQuant)](https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/llama-${TAG_NAME}-bin-ubuntu-hip-turboquant-x64.tar.gz)"
          } > release_body.md

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          body_path: release_body.md

      - name: Upload release
        id: upload_release
        uses: actions/github-script@v8
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const path = require('path');
            const fs = require('fs');
            const release_id = '${{ steps.create_release.outputs.id }}';
            const files = fs.readdirSync('./release');
            // UPLOAD GUARD: Prevents GitHub API error when release dir is empty
            // (can happen if all artifact downloads fail or HIP build failed)
            if (files.length === 0) {
              console.log('No artifacts to upload');
              return;
            }
            for (let file of files) {
              if (path.extname(file) === '.zip' || file.endsWith('.tar.gz')) {
                console.log('uploadReleaseAsset', file);
                await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release_id,
                  name: file,
                  data: await fs.readFileSync(`./release/${file}`)
                });
              }
            }
