name: "Determine tag name"
description: "Determine the tag name to use for a release"
inputs:
  version:
    description: "Optional stable version override (e.g. v0.5.0). Appends '-stable' suffix."
    required: false
    default: ""
  stable_version:
    description: "Fallback stable version from workflow env (e.g. v0.5.0). Used when inputs.version is empty."
    required: false
    default: ""
outputs:
  name:
    description: "The name of the tag"
    value: ${{ steps.tag.outputs.name }}

runs:
  using: "composite"
  steps:
    - name: Determine tag name
      id: tag
      shell: bash
      run: |
        # Prefer inputs.version, fall back to inputs.stable_version
        VERSION="${{ inputs.version }}"
        if [[ -z "$VERSION" ]]; then
          VERSION="${{ inputs.stable_version }}"
        fi
        if [[ -n "$VERSION" ]]; then
          # Stable release: use provided version with -stable suffix
          echo "name=${VERSION}-stable" >> $GITHUB_OUTPUT
        else
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          SHORT_HASH="$(git rev-parse --short=7 HEAD)"
          if [[ "${{ env.BRANCH_NAME }}" == "master" || "${{ env.BRANCH_NAME }}" == "main" ]]; then
            echo "name=b${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          else
            SAFE_NAME=$(echo "${{ env.BRANCH_NAME }}" | tr '/' '-')
            echo "name=${SAFE_NAME}-b${BUILD_NUMBER}-${SHORT_HASH}" >> $GITHUB_OUTPUT
          fi
        fi
